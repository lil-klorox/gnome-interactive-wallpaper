name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends gjs gnome-shell make zip git ca-certificates  # before checkout: no git = no .git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {persist-credentials: false}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make pack  # pack runs check first
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends gjs gnome-shell make zip git ca-certificates  # before checkout: no git = no .git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {persist-credentials: false}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make pack  # rebuilt rather than passed between jobs: simpler than artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: 'build/*.shell-extension.zip'
